<svg fill="none" viewBox="0 0 620 240" width="100%" height="240" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
        .term-box {
          background-color: #0b0f19;
          border: 1px solid #1e293b;
          border-radius: 8px;
          padding: 16px 20px;
          font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
          font-size: 13px;
          line-height: 1.65;
          color: #94a3b8;
          box-sizing: border-box;
        }
        .term-header {
          border-bottom: 1px solid #1e293b;
          padding-bottom: 8px;
          margin-bottom: 12px;
          display: block;
        }
        .dot {
          display: inline-block;
          width: 10px;
          height: 10px;
          border-radius: 50%;
          margin-right: 5px;
        }
        .dot-red { background-color: #f43f5e; }
        .dot-yellow { background-color: #eab308; }
        .dot-green { background-color: #10b981; }
        .term-title {
          color: #cbd5e1;
          font-weight: 600;
          margin-left: 8px;
          display: inline-block;
          vertical-align: middle;
        }
        .text-accent { color: #38bdf8; }
        .text-err { color: #fb7185; }
        .text-ok { color: #34d399; }
        .text-warn { color: #fbbf24; }
        .cursor {
          display: inline-block;
          width: 8px;
          height: 14px;
          background-color: #38bdf8;
          vertical-align: middle;
          margin-left: 4px;
          animation: blink 1s infinite;
        }
      </style>
      <div class="term-box">
        <div class="term-header">
          <span class="dot dot-red"></span>
          <span class="dot dot-yellow"></span>
          <span class="dot dot-green"></span>
          <span class="term-title">RUNTIME_MONITOR // CORE_DUMP_INSPECTOR</span>
        </div>
        <div>&gt; ENTITY: <span class="text-accent">NekoAida</span> | CLASS: <span class="text-warn">Script Novice [LV: 01]</span> | RANK: <span class="text-err">F</span></div>
        <div>&gt; SYSTEM STATE: <span class="text-err">CRITICAL_FAULT (EXIT: 0x90909090)</span></div>
        <div>&gt; INGRESS TUNNEL: <span class="text-ok">0x29CE LISTENING [DELAY: 10702ms]</span></div>
        <div>&gt; VCS TOPOLOGY: <span class="text-accent">LINEAR_HISTORY (ACTIVE_BRANCH: 0)</span></div>
        <div>&gt; THREAD HOOK: <span class="text-warn">EVENT_DISPATCH_THREAD (EDT_ACTIVE)</span></div>
        <div>&gt; EXECUTION_STATUS: NOVICE_IDLE<span class="cursor"></span></div>
      </div>
    </div>
  </foreignObject>
</svg>
